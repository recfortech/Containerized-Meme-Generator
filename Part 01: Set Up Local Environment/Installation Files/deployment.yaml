apiVersion: apps/v1
kind: Deployment
metadata:
  name: memeflask
  labels:
    app: meme-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meme-flask
  template:
    metadata:
      labels:
        app: meme-flask
    spec:
      containers:
        - name: meme-flask-container
          image: meme-flask:latest
          imagePullPolicy: Never
          workingDir: /app
          command: ["python", "meme-flask.py"]
          ports:
            - containerPort: 5000
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: app-code
          hostPath:
            path: /mnt/meme
            type: Directory
